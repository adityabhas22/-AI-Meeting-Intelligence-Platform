[project]
name = "meeting-intel"
version = "0.1.0"
description = "AI Meeting Intelligence Platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.49",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.50",
    "psycopg[binary]>=3.3",
    "pgvector>=0.4.2",
    "alembic>=1.18",
    "deepgram-sdk>=7.3",
    "openai>=2.41",
    "openai-agents>=0.17",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: hits real external APIs, opt in (deselected by default)",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
